data:
  tickers: ["AAPL", "MSFT", "NVDA", "GOOGL", "AMZN", "META", "TSLA", "SPY", "QQQ", "IWM"]
  start_date: "2010-01-01"
model:
  cv_splits: 6
  optuna_trials: 100
  target: next_5d_return
features:
  lookbacks: [5, 20, 60]
backtest:
  initial_cash: 100000
  fees: 0.001
  slippage: 0.0005
  stop_loss: 0.08
  take_profit: 0.20
risk:
  max_position_pct: 0.12
  max_gross_leverage: 1.0
  max_drawdown_kill: 0.15
  kelly_fraction: 0.35
  vol_target: 0.15
paper_trading:
  enabled: true
  interval_sec: 60
  log_file: ./data/paper_trades.db
